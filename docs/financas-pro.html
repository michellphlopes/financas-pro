<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinançasPro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f8fafc;color:#1e293b;font-family:'Syne',sans-serif;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
.app-header{padding:20px 24px 0;background:linear-gradient(180deg,#f8fafc 0%,transparent 100%)}
.app-title{font-size:1.5rem;font-weight:800;letter-spacing:-0.5px;color:#0f172a}
.app-title span{color:#34d399}
.app-subtitle{font-size:.75rem;color:#64748b;margin-top:2px;font-family:'DM Mono',monospace}
.tabs-wrap{display:flex;gap:4px;overflow-x:auto;padding:16px 24px 0;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px 8px 0 0;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;background:#ffffff;color:#64748b;transition:all .2s}
.tab-btn:hover{color:#94a3b8;background:#f1f5f9}
.tab-btn.active{background:#f1f5f9;color:#0f172a;border-top:2px solid #34d399}
.content{flex:1;padding:0 24px 40px;background:#f1f5f9;border-top:1px solid #e2e8f0}
.section{padding:28px 0;border-bottom:1px solid #cbd5e1}
.section:last-child{border-bottom:none}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-size:1.1rem;font-weight:700;color:#0f172a}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-title{font-size:.85rem;font-weight:600;color:#94a3b8;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.total-badge{font-family:'DM Mono',monospace;font-size:.8rem;font-weight:500;padding:4px 12px;border-radius:100px}
.total-badge.red{background:#ef444420;color:#f87171;border:1px solid #ef444440}
.total-badge.green{background:#22c55e20;color:#4ade80;border:1px solid #22c55e40}
.total-badge.yellow{background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b40}
.btn-add{padding:8px 16px;border-radius:8px;border:1px solid #34d39940;background:#34d39915;color:#34d399;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-add:hover{background:#34d39925}
.btn-primary{padding:10px 24px;border-radius:8px;border:none;background:#34d399;color:#f8fafc;font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px;transition:all .2s;width:100%}
.btn-primary:hover{background:#6ee7b7}
.btn-sm{padding:5px 12px;border-radius:6px;border:1px solid #34d39940;background:#34d39910;color:#34d399;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif}
.btn-sm.outline{background:transparent;border-color:#e2e8f0;color:#94a3b8}
.btn-sm.danger{background:#ef444410;border-color:#ef444440;color:#f87171}
.btn-nav{width:32px;height:32px;border-radius:6px;border:1px solid #e2e8f0;background:#f1f5f9;color:#94a3b8;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-icon{width:24px;height:24px;border-radius:4px;border:none;background:transparent;color:#4b5563;font-size:.75rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-icon:hover{background:#ef444420;color:#f87171}
.card-list{display:flex;flex-direction:column;gap:10px}
.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;transition:border-color .2s}
.card:hover{border-color:#34d39940}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-name{font-weight:700;color:#0f172a;margin-bottom:4px}
.card-sub{font-size:.75rem;color:#64748b;font-family:'DM Mono',monospace}
.card-value{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:500}
.card-value.red{color:#f87171}
.card-value.green{color:#4ade80}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.right-group{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status-badge{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:100px;border:1px solid;cursor:pointer;font-family:'Syne',sans-serif;transition:all .2s}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-month-label{font-size:.9rem;font-weight:700;color:#0f172a;min-width:100px;text-align:center}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-day-name{text-align:center;font-size:.7rem;color:#4b5563;font-weight:600;padding:4px 0;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;background:#ffffff;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:default;border:1px solid transparent;transition:border-color .2s;overflow:visible}
.cal-cell.has-events{border-color:#e2e8f0}
.cal-cell.today{background:#1e2a20;border-color:#34d399!important}
.cal-cell.empty{background:transparent;border:none}
.cal-day-num{font-size:.75rem;color:#64748b;font-family:'DM Mono',monospace}
.cal-cell.today .cal-day-num{color:#34d399;font-weight:700}
.cal-events{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.cal-event-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-event-more{font-size:.55rem;color:#64748b}
.cal-tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:.72rem;white-space:nowrap;z-index:100;min-width:160px;box-shadow:0 8px 24px #00000015}
.cal-cell:hover .cal-tooltip{display:block}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid #e2e8f0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:#64748b}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cartao-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cartao-card{background:linear-gradient(135deg,#ffffff,#f1f5f9);border:1px solid #e2e8f0;border-radius:14px;padding:18px}
.cartao-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cartao-nome{font-weight:700;color:#0f172a}
.cartao-juros{font-size:.72rem;color:#f59e0b;font-family:'DM Mono',monospace;background:#f59e0b15;padding:3px 8px;border-radius:100px}
.cartao-valor{font-family:'DM Mono',monospace;font-size:1.4rem;font-weight:500;color:#f87171;margin-bottom:4px}
.cartao-limite{font-size:.72rem;color:#64748b;margin-bottom:10px}
.cartao-bar-bg{background:#f8fafc;border-radius:100px;height:6px;margin-bottom:12px;overflow:hidden}
.cartao-bar-fill{height:100%;border-radius:100px;transition:width .4s}
.cartao-datas{display:flex;justify-content:space-between;font-size:.72rem;color:#64748b}
.cartao-datas strong{color:#94a3b8}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.desp-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;padding-right:4px}
.desp-list::-webkit-scrollbar{width:4px}
.desp-list::-webkit-scrollbar-track{background:transparent}
.desp-list::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
.desp-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#ffffff;border-radius:8px}
.desp-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.desp-info{flex:1;min-width:0}
.desp-nome{font-size:.85rem;color:#1e293b;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desp-meta{font-size:.7rem;color:#64748b;font-family:'DM Mono',monospace}
.desp-valor{font-family:'DM Mono',monospace;font-size:.85rem;color:#f87171;flex-shrink:0}
.cat-bars{display:flex;flex-direction:column;gap:10px}
.cat-bar-row{display:flex;align-items:center;gap:8px}
.cat-bar-label{width:90px;font-size:.72rem;color:#94a3b8;flex-shrink:0}
.cat-bar-bg{flex:1;background:#f8fafc;border-radius:100px;height:8px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:100px;transition:width .4s}
.cat-bar-val{width:70px;font-family:'DM Mono',monospace;font-size:.72rem;color:#64748b;text-align:right;flex-shrink:0}
.fixa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fixa-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;position:relative}
.fixa-dia{font-size:.7rem;color:#34d399;font-family:'DM Mono',monospace;font-weight:500;margin-bottom:6px}
.fixa-nome{font-weight:700;color:#0f172a;font-size:.9rem;margin-bottom:2px}
.fixa-cat{font-size:.7rem;color:#64748b;margin-bottom:8px}
.fixa-valor{font-family:'DM Mono',monospace;font-size:1rem;color:#fbbf24}
.fixa-card .btn-icon{position:absolute;top:8px;right:8px}
.estrat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
@media(max-width:500px){.estrat-grid{grid-template-columns:1fr 1fr}}
.estrat-kpi{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.kpi-label{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-family:'DM Mono',monospace;font-size:1rem;font-weight:500}
.kpi-value.green{color:#4ade80}
.kpi-value.red{color:#f87171}
.kpi-value.yellow{color:#fbbf24}
.estrat-row{margin-bottom:20px}
.reserva-box{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
.reserva-header{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.85rem;color:#94a3b8}
.reserva-vals{font-family:'DM Mono',monospace;color:#34d399}
.reserva-bar-bg{background:#f8fafc;border-radius:100px;height:10px;overflow:hidden;margin-bottom:6px}
.reserva-bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#6ee7b7);border-radius:100px;transition:width .5s}
.reserva-pct{font-size:.72rem;color:#64748b;font-family:'DM Mono',monospace}
.suggestions{margin-bottom:16px}
.suggestion-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-left:3px solid;border-radius:0 8px 8px 0;background:#ffffff;margin-bottom:8px;font-size:.82rem;color:#334155}
.notas-box{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
.notas-title{font-size:.8rem;color:#64748b;margin-bottom:8px;font-weight:600}
.notas-text{font-size:.85rem;color:#94a3b8;line-height:1.6}
.modal-overlay{position:fixed;inset:0;background:#00000080;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px #00000020}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 14px;border-bottom:1px solid #e2e8f0}
.modal-title{font-weight:700;color:#0f172a}
.modal-close{background:none;border:none;color:#64748b;font-size:1rem;cursor:pointer;padding:2px 6px}
.modal-body{padding:18px 20px 20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px}
@media(max-width:420px){.form-grid{grid-template-columns:1fr}}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:#94a3b8;font-weight:600}
.form-grid input,.form-grid select,.form-grid textarea{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 12px;color:#0f172a;font-family:'Syne',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:#34d39980}
.form-grid select{appearance:none}
.hist-table{width:100%;border-collapse:collapse;font-size:.82rem}
.hist-table th{padding:8px 10px;text-align:left;color:#64748b;border-bottom:1px solid #e2e8f0;font-size:.72rem;text-transform:uppercase}
.hist-table td{padding:8px 10px;color:#334155;border-bottom:1px solid #cbd5e1;font-family:'DM Mono',monospace}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:#64748b;font-size:.9rem;gap:10px}
.spinner{width:20px;height:20px;border:2px solid #e2e8f0;border-top-color:#34d399;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#ffffff;border:1px solid #34d39940;color:#34d399;padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;z-index:9999;animation:fadeIn .3s ease;box-shadow:0 8px 24px #00000015}
.toast.error{border-color:#ef444440;color:#f87171}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div> Conectando ao banco de dados...</div>
</div>

<script>
const SUPABASE_URL = 'https://ejvpukysdyjnofpeknpy.supabase.co';
const SUPABASE_KEY = 'sb_publishable__7bcUdVrlkwv1s4vN6wVTw_votUzPSe';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,9);
const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const CAT_COLORS = {Alimentação:'#f59e0b',Moradia:'#06b6d4',Transporte:'#8b5cf6',Saúde:'#22c55e',Lazer:'#ec4899',Educação:'#3b82f6',Utilities:'#06b6d4',Outros:'#94a3b8'};

let state = { dividas:[], creditos:[], cartoes:[], despesasMes:[], despesasFixas:[], estrategia:{meta:50000,reserva:0,renda:0,notas:''}, tab:'calendario', modal:null, modalData:null, viewYear: new Date().getFullYear(), viewMonth: new Date().getMonth() };

function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (type==='error'?' error':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

async function loadAll() {
  try {
    const [d,c,ca,dm,df,es] = await Promise.all([
      sb.from('dividas').select('*'),
      sb.from('creditos').select('*'),
      sb.from('cartoes').select('*'),
      sb.from('despesas_mes').select('*'),
      sb.from('despesas_fixas').select('*'),
      sb.from('estrategia').select('*').eq('id','main').single()
    ]);
    state.dividas = (d.data||[]).map(x=>({...x, historico: x.historico||[], juros: x.juros, tipoJuros: x.tipo_juros, vencimento: x.vencimento}));
    state.creditos = c.data||[];
    state.cartoes = (ca.data||[]).map(x=>({...x, saldoAtual: x.saldo_atual, tipoJuros: x.tipo_juros}));
    state.despesasMes = dm.data||[];
    state.despesasFixas = df.data||[];
    if(es.data) state.estrategia = es.data;
    render();
  } catch(e) {
    toast('Erro ao carregar dados', 'error');
    render();
  }
}

// ── RENDER ENGINE ─────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const TABS = [{id:'calendario',label:'Calendário',icon:'📅'},{id:'dividas',label:'Dívidas',icon:'💸'},{id:'creditos',label:'Créditos',icon:'💰'},{id:'cartoes',label:'Cartões',icon:'💳'},{id:'despesas-mes',label:'Despesas Mês',icon:'🧾'},{id:'despesas-fixas',label:'Fixas',icon:'📌'},{id:'estrategia',label:'Estratégia',icon:'🎯'}];
  app.innerHTML = `
    <div class="app-header">
      <div class="app-title">Finanças<span>Pro</span></div>
      <div class="app-subtitle">gestão financeira pessoal · supabase</div>
    </div>
    <div class="tabs-wrap">
      ${TABS.map(t=>`<button class="tab-btn ${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.icon} ${t.label}</button>`).join('')}
    </div>
    <div class="content">
      ${state.tab==='calendario' ? renderCalendario() : ''}
      ${state.tab==='dividas' ? renderDividas() : ''}
      ${state.tab==='creditos' ? renderCreditos() : ''}
      ${state.tab==='cartoes' ? renderCartoes() : ''}
      ${state.tab==='despesas-mes' ? renderDespesasMes() : ''}
      ${state.tab==='despesas-fixas' ? renderDespesasFixas() : ''}
      ${state.tab==='estrategia' ? renderEstrategia() : ''}
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}

function setTab(t){ state.tab=t; state.modal=null; render(); }

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function renderCalendario() {
  const {viewYear:vy, viewMonth:vm} = state;
  const events = [];
  state.dividas.forEach(d=>{if(d.vencimento) events.push({date:d.vencimento,label:`💳 ${d.nome}`,color:'#ef4444'})});
  state.creditos.forEach(c=>{if(c.vencimento) events.push({date:c.vencimento,label:`💰 ${c.nome}`,color:'#22c55e'})});
  state.cartoes.forEach(c=>{
    const pad = n=>String(n).padStart(2,'0');
    events.push({date:`${vy}-${pad(vm+1)}-${pad(c.vencimento)}`,label:`💳 ${c.nome} vcto`,color:'#f59e0b'});
    events.push({date:`${vy}-${pad(vm+1)}-${pad(c.fechamento)}`,label:`🔒 ${c.nome} fech.`,color:'#8b5cf6'});
  });
  state.despesasFixas.forEach(df=>{
    const pad=n=>String(n).padStart(2,'0');
    events.push({date:`${vy}-${pad(vm+1)}-${pad(df.dia)}`,label:`📌 ${df.nome}`,color:'#06b6d4'});
  });
  const evByDate={};
  events.forEach(e=>{if(!evByDate[e.date])evByDate[e.date]=[];evByDate[e.date].push(e)});
  const firstDay=new Date(vy,vm,1).getDay();
  const daysInMonth=new Date(vy,vm+1,0).getDate();
  const cells=[...Array(firstDay).fill(null),...Array.from({length:daysInMonth},(_,i)=>i+1)];
  const pad=n=>String(n).padStart(2,'0');
  return `<section class="section">
    <div class="section-header">
      <h2 class="section-title">📅 Calendário de Vencimentos</h2>
      <div class="cal-nav">
        <button class="btn-nav" onclick="calNav(-1)">‹</button>
        <span class="cal-month-label">${MONTHS[vm]} ${vy}</span>
        <button class="btn-nav" onclick="calNav(1)">›</button>
      </div>
    </div>
    <div class="cal-grid-header">${DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
    <div class="cal-grid">
      ${cells.map((day,i)=>{
        if(!day) return `<div class="cal-cell empty"></div>`;
        const ds=`${vy}-${pad(vm+1)}-${pad(day)}`;
        const dayEvents=evByDate[ds]||[];
        const isToday=ds===todayStr();
        return `<div class="cal-cell ${isToday?'today':''} ${dayEvents.length?'has-events':''}">
          <span class="cal-day-num">${day}</span>
          <div class="cal-events">${dayEvents.slice(0,2).map(ev=>`<span class="cal-event-dot" style="background:${ev.color}" title="${ev.label}"></span>`).join('')}${dayEvents.length>2?`<span class="cal-event-more">+${dayEvents.length-2}</span>`:''}</div>
          ${dayEvents.length?`<div class="cal-tooltip">${dayEvents.map(ev=>`<div style="color:${ev.color}">${ev.label}</div>`).join('')}</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="cal-legend">
      ${[['#ef4444','Dívidas'],['#22c55e','Créditos'],['#f59e0b','Cartão Vcto'],['#8b5cf6','Cartão Fech.'],['#06b6d4','Desp. Fixas']].map(([c,l])=>`<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${l}</span>`).join('')}
    </div>
  </section>`;
}
function calNav(d){ state.viewMonth+=d; if(state.viewMonth<0){state.viewMonth=11;state.viewYear--}if(state.viewMonth>11){state.viewMonth=0;state.viewYear++} render(); }

// ── DÍVIDAS ───────────────────────────────────────────────────────────────────
function renderDividas() {
  const total = state.dividas.reduce((s,d)=>s+Number(d.valor),0);
  return `<section class="section">
    <div class="section-header">
      <h2 class="section-title">💸 Dívidas</h2>

async function saveLancamento(e) {

  const id = state.modalData;
  const d = state.dividas.find(x=>x.id===id);
  const pago = Number(f.get('valor'));
  const novoValor = Math.max(0, d.valor - pago);
  const novoHist = [...(d.historico||[]), {data:f.get('data'),valor:pago,obs:f.get('obs')}];

  state.modal=null; toast('Pagamento registrado!'); render();
}

// ── ESTRATÉGIA ────────────────────────────────────────────────────────────────
function renderEstrategia() {
  const es = state.estrategia;
  const renda = Number(es.renda)||0;
  const totalFixas = state.despesasFixas.reduce((s,f)=>s+Number(f.valor),0);
  const totalMes = state.despesasMes.reduce((s,d)=>s+Number(d.valor),0);
  const totalFaturas = state.cartoes.reduce((s,c)=>s+Number(c.saldo_atual||c.saldoAtual),0);
  const totalDividas = state.dividas.reduce((s,d)=>s+Number(d.valor),0);
  const totalCreditos = state.creditos.filter(c=>c.status!=='recebido').reduce((s,c)=>s+Number(c.valor),0);
  const totalSaidas = totalFixas+totalMes+totalFaturas;
  const saldo = renda-totalSaidas;
  const pctSaidas = renda>0?((totalSaidas/renda)*100).toFixed(1):0;
  const progReserva = Math.min(100,((Number(es.reserva)/Number(es.meta))*100));
  const suggestions = [];
  if(pctSaidas>70) suggestions.push({icon:'⚠️',msg:`Saídas acima de 70% da renda. Revise gastos variáveis.`,color:'#ef4444'});
  const limiteTotal = state.cartoes.reduce((s,c)=>s+Number(c.limite),0);
  if(limiteTotal>0 && totalFaturas/limiteTotal>0.5) suggestions.push({icon:'💳',msg:'Utilização dos cartões acima de 50%. Risco de endividamento.',color:'#f59e0b'});
  if(saldo>0 && suggestions.length===0) suggestions.push({icon:'✅',msg:`Saldo positivo de ${fmt(saldo)}. Bom momento para aportar na reserva.`,color:'#22c55e'});
  if(totalCreditos>0) suggestions.push({icon:'💰',msg:`${fmt(totalCreditos)} em créditos pendentes. Acompanhe os recebimentos.`,color:'#06b6d4'});
  return `<section class="section">
    <div class="section-header">
      <h2 class="section-title">🎯 Estratégia Financeira</h2>
      <button class="btn-add" onclick="openModal('edit-estrategia')">Editar</button>
    </div>
    <div class="estrat-grid">
      <div class="estrat-kpi"><div class="kpi-label">Renda Mensal</div><div class="kpi-value green">${fmt(renda)}</div></div>
      <div class="estrat-kpi"><div class="kpi-label">Total Saídas</div><div class="kpi-value red">${fmt(totalSaidas)}</div></div>
      <div class="estrat-kpi"><div class="kpi-label">Saldo Disponível</div><div class="kpi-value" style="color:${saldo>=0?'#4ade80':'#f87171'}">${fmt(saldo)}</div></div>
      <div class="estrat-kpi"><div class="kpi-label">Total Dívidas</div><div class="kpi-value red">${fmt(totalDividas)}</div></div>
      <div class="estrat-kpi"><div class="kpi-label">Comprometimento</div><div class="kpi-value yellow">${pctSaidas}% renda</div></div>
      <div class="estrat-kpi"><div class="kpi-label">Créditos Pendentes</div><div class="kpi-value green">${fmt(totalCreditos)}</div></div>
    </div>
    <div class="estrat-row">
      <div class="reserva-box">
        <div class="reserva-header"><span>🏦 Reserva de Emergência</span><span class="reserva-vals">${fmt(es.reserva)} / ${fmt(es.meta)}</span></div>
        <div class="reserva-bar-bg"><div class="reserva-bar-fill" style="width:${progReserva}%"></div></div>
        <div class="reserva-pct">${progReserva.toFixed(1)}% da meta</div>
      </div>
    </div>
    <div class="suggestions">
      <div class="sub-title">📊 Análise e Sugestões</div>
      ${suggestions.map(s=>`<div class="suggestion-row" style="border-left-color:${s.color}"><span>${s.icon}</span><span>${s.msg}</span></div>`).join('')}
    </div>
    ${es.notas?`<div class="notas-box"><div class="notas-title">📝 Notas Estratégicas</div><div class="notas-text">${es.notas}</div></div>`:''}
  </section>`;
}

  const rec = {id:'main',meta:Number(f.get('meta')),reserva:Number(f.get('reserva')),renda:Number(f.get('renda')),notas:f.get('notas')};

  return `<div class="modal-overlay" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header"><span class="modal-title">${titles[state.modal]||''}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">${body}</div>
    </div>
  </div>`;
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
